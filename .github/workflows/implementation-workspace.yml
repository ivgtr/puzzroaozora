name: Implementation verification (temporary)
on:
  push:
    branches: [codex/issue-1-manuscript-desk]
    paths: [.github/workflows/implementation-workspace.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1-manuscript-desk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, before, after):
              p = Path(path)
              text = p.read_text()
              assert before in text, (path, before)
              p.write_text(text.replace(before, after))
          scene = 'src/game/DeskScene.ts'
          patch(scene, 'import { Paper, INK, PAPER, MAT }', 'import { Paper, PAPER, MAT }')
          patch(scene, 'if (this.gesture?.kind === "paper" && this.session) {\n      const stable = this.session.state.chains.find((chain) => chain.id === this.gesture?.id);', 'const gesture = this.gesture;\n    if (gesture?.kind === "paper" && this.session) {\n      const stable = this.session.state.chains.find((chain) => chain.id === gesture.id);')
          patch(scene, 'const views = [...this.views].reverse();', 'const views = [...this.views].sort((a, b) => this.world.getIndex(b[1].paper) - this.world.getIndex(a[1].paper));')
          patch(scene, 'this.game.canvas.addEventListener("pointercancel", this.cancelGesture);', 'this.game.canvas.addEventListener("pointercancel", this.cancelGesture);\n    this.game.canvas.addEventListener("touchcancel", this.cancelGesture);')
          patch(scene, 'this.game.canvas.removeEventListener("pointercancel", this.cancelGesture);', 'this.game.canvas.removeEventListener("pointercancel", this.cancelGesture);\n    this.game.canvas.removeEventListener("touchcancel", this.cancelGesture);')
          patch(scene, 'const visible = this.saved.slice(this.reviewPage * 3, this.reviewPage * 3 + 3);', 'const perPage = Math.max(1, Math.min(3, Math.floor((height - 134) / 110)));\n      this.reviewPage = Math.min(this.reviewPage, Math.max(0, Math.ceil(this.saved.length / perPage) - 1));\n      const visible = this.saved.slice(this.reviewPage * perPage, (this.reviewPage + 1) * perPage);')
          patch(scene, 'Math.ceil(this.saved.length / 3) - 1', 'Math.ceil(this.saved.length / perPage) - 1')
          patch('tests/model.test.ts', 'note: "fixture", difficulty', 'note: "fixture", location: "fixture", difficulty')
          patch('tests/model.test.ts', '["abcXab", "abc", "Y"]', '["bcXa", "abc", "Y"]')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/DeskScene.ts tests/model.test.ts
          git commit -m 'fix: narrow cancelled gestures and preserve topmost paper hit targets'
          git push origin HEAD:codex/issue-1-manuscript-desk
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run lint && npm run typecheck && npm run build
      - name: Verify excerpts against the primary sources
        continue-on-error: true
        run: |
          node --experimental-strip-types --input-type=module -e 'import {PASSAGES} from "./src/data/passages.ts"; console.log(JSON.stringify(PASSAGES))' > /tmp/passages.json
          python3 - <<'PY'
          import json, re, urllib.request
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.out=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ('rt','rp','script','style'): self.skip+=1
              def handle_endtag(self, tag):
                  if tag in ('rt','rp','script','style'): self.skip=max(0,self.skip-1)
              def handle_data(self, data):
                  if not self.skip: self.out.append(data)
          cache={}; failed=[]
          for passage in json.load(open('/tmp/passages.json')):
              url=passage['sourceUrl']
              if url not in cache:
                  raw=urllib.request.urlopen(url,timeout=30).read()
                  parser=Text(); parser.feed(raw.decode('cp932'))
                  cache[url]=re.sub(r'\s+','',''.join(parser.out))
              original=re.sub(r'\s+','',passage['original'])
              found=original in cache[url]
              print(passage['id'], 'SOURCE MATCH' if found else 'SOURCE MISMATCH', url)
              if not found: failed.append(passage['id'])
          assert not failed, failed
          PY
      - name: Prepare one-off browser verification
        run: |
          npm install --prefix /tmp/browser --no-audit --no-fund playwright agent-browser
          /tmp/browser/node_modules/.bin/playwright install chromium --with-deps
          /tmp/browser/node_modules/.bin/agent-browser install
          npm start -- -p 5678 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5678 >/dev/null && break; sleep 1; done
          mkdir -p /tmp/evidence
      - name: Agent browser visual entry check
        continue-on-error: true
        run: |
          export PATH=/tmp/browser/node_modules/.bin:$PATH
          agent-browser --args '--enable-unsafe-swiftshader,--use-angle=swiftshader' open http://127.0.0.1:5678
          agent-browser wait --load networkidle
          agent-browser snapshot -i
          agent-browser screenshot /tmp/evidence/library-agent.png
          agent-browser eval 'document.querySelector("[data-nextjs-dialog]") ? "ERROR_OVERLAY" : document.querySelector("main").dataset.gameMode'
          agent-browser close
      - name: Representative game interaction
        run: |
          cat > /tmp/browser/smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const browser = await chromium.launch({args:['--enable-unsafe-swiftshader','--use-angle=swiftshader']});
          const context = await browser.newContext({viewport:{width:1280,height:800},deviceScaleFactor:2});
          const page = await context.newPage();
          const errors=[]; page.on('pageerror',error=>{errors.push(error.message); console.log('PAGE ERROR',error.message);});
          page.on('console',message=>{if(message.type()==='error') console.log('CONSOLE ERROR',message.text());});
          const mode=async value=>await page.waitForSelector(`main[data-game-mode="${value}"]`,{timeout:30000});
          const action=async id=>await page.locator(`[data-action="${id}"]`).evaluate(element=>element.click());
          const pieces=async()=>await page.locator('[data-piece]').evaluateAll(elements=>elements.map(element=>({id:element.dataset.piece,text:element.textContent})));
          try {
            await page.goto('http://127.0.0.1:5678');
            await mode('library');
            assert.equal(await page.locator('canvas').count(),1);
            await page.screenshot({path:'/tmp/evidence/desktop-library.png'});
            // Use an actual canvas pointer on the first book, not a test-only scene API.
            await page.mouse.click(584,187); await mode('reading');
            const original=await page.locator('[data-original]').textContent();
            await page.screenshot({path:'/tmp/evidence/desktop-reading.png'});
            await page.mouse.click(90,770); await mode('assembling');
            assert.equal(await page.locator('[data-original]').count(),0);
            const initial=await pieces(); assert.equal(initial.length,12);
            await page.screenshot({path:'/tmp/evidence/desktop-desk.png'});
            await page.locator('canvas').focus(); await page.keyboard.press('r'); await mode('review');
            assert.equal(await page.locator('[data-original]').textContent(),original);
            await page.keyboard.press('Escape'); await mode('assembling');
            assert.deepEqual(await pieces(),initial);
            // All accessibility controls feed the same scene commands as tap/drag.
            const expected=original.replace(/(^|\n)[ \u3000]+/g,'$1').replace(/\n/g,'');
            let remaining=expected;
            const ordered=[];
            const pool=[...initial];
            while(remaining){const index=pool.findIndex(piece=>remaining.startsWith(piece.text));assert.ok(index>=0);const [piece]=pool.splice(index,1);ordered.push(piece);remaining=remaining.slice(piece.text.length);}
            let left=ordered.shift();
            for (const right of ordered){
              await page.locator(`[data-piece="${right.id}"]`).evaluate(element=>element.click());
              await action(`join:after:${left.id}`);
              left.text+=right.text;
            }
            await mode('complete');
            assert.equal(await page.locator('[data-original]').textContent(),original);
            await page.screenshot({path:'/tmp/evidence/desktop-complete.png'});
            await action('undo'); await mode('assembling');
            assert.equal((await pieces()).length,2);
            await action('library'); await mode('leave'); await action('confirm'); await mode('library');
            await action('import'); await mode('import');
            await page.locator('#work-url').fill('https://www.aozora.gr.jp/cards/000148/card789.html');
            await page.screenshot({path:'/tmp/evidence/import.png'});
            await page.locator('#work-url').press('Escape'); await mode('library');
            assert.deepEqual(errors,[]);
            console.log('PASS desktop: real canvas entry, read, 12 pieces, review freeze, common-command completion, undo, import focus');
            const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,hasTouch:true});
            const phone=await mobile.newPage();
            phone.on('pageerror',error=>errors.push(error.message));
            await phone.goto('http://127.0.0.1:5678'); await phone.waitForSelector('main[data-game-mode="library"]');
            await phone.touchscreen.tap(315,187); await phone.waitForSelector('main[data-game-mode="reading"]');
            await phone.touchscreen.tap(90,814); await phone.waitForSelector('main[data-game-mode="assembling"]');
            assert.equal(await phone.locator('[data-piece]').count(),12);
            await phone.screenshot({path:'/tmp/evidence/mobile-desk.png'});
            const client=await mobile.newCDPSession(phone);
            await client.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{x:170,y:370,id:1},{x:220,y:400,id:2}]});
            await client.send('Input.dispatchTouchEvent',{type:'touchMove',touchPoints:[{x:130,y:330,id:1},{x:260,y:450,id:2}]});
            await client.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
            assert.equal(await phone.locator('[data-piece]').count(),12);
            await phone.setViewportSize({width:844,height:390});
            await phone.screenshot({path:'/tmp/evidence/mobile-landscape.png'});
            assert.equal(await phone.locator('canvas').count(),1);
            assert.deepEqual(errors,[]);
            console.log('PASS mobile: portrait touch entry, two-finger zoom does not join pieces, landscape resize');
            await mobile.close();
          } catch(error) {
            console.log('DIAGNOSTIC',await page.locator('body').innerText());
            await page.screenshot({path:'/tmp/evidence/failure.png'});
            throw error;
          } finally {await browser.close();}
          JS
          node /tmp/browser/smoke.mjs
      - name: Preserve small review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-verification
          path: |
            /tmp/evidence/
            /tmp/server.log
          retention-days: 7
      - name: Environment summary
        if: always()
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          cat /tmp/server.log || true
