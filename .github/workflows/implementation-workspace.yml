name: Implementation verification (temporary)
on:
  push:
    branches: [codex/issue-1-manuscript-desk]
    paths: [.github/workflows/implementation-workspace.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-1-manuscript-desk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Give manuscript choices distinct accessible names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/game/DeskScene.ts'); text=p.read_text()
          before='this.button(`open-${passage.id}`, "読む", x + cardWidth - 78, y + 15, 62, 40, () => { void this.openPassage(passage); });'
          assert before in text
          text=text.replace(before,before+'\n      this.actions.get(`open-${passage.id}`)!.label = `${passage.title}（${passage.author}）・${passage.location}を読む`;')
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/DeskScene.ts
          git commit -m 'fix: distinguish manuscript choices in accessible navigation'
          git push origin HEAD:codex/issue-1-manuscript-desk
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run lint && npm run typecheck && npm run build
      - name: Prepare isolated browser verification
        run: |
          npm install --prefix /tmp/browser --no-audit --no-fund playwright
          /tmp/browser/node_modules/.bin/playwright install chromium
          node --experimental-strip-types --input-type=module -e 'import {PASSAGES} from "./src/data/passages.ts"; console.log(JSON.stringify(PASSAGES))' > /tmp/passages.json
          git fetch --depth=1 origin 73c0cb431732329d772b01b2eed891152ec0c395
          git show 73c0cb431732329d772b01b2eed891152ec0c395:.github/workflows/implementation-workspace.yml > /tmp/previous-verification.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('/tmp/previous-verification.yml').read_text()
          source=text.split("cat > /tmp/browser/smoke.mjs <<'JS'\n",1)[1].split('\n          JS\n',1)[0]
          source=textwrap.dedent(source)
          # The earlier pointer test released a piece near another valid endpoint.
          # Release into empty lower workspace; keep the same real drag and Undo.
          assert 'page.mouse.move(100,250,{steps:6})' in source
          source=source.replace('page.mouse.move(100,250,{steps:6})','page.mouse.move(60,700,{steps:6})')
          Path('/tmp/browser/smoke.mjs').write_text(source)
          PY
          npm start -- -p 5678 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5678 >/dev/null && break; sleep 1; done
          mkdir -p /tmp/evidence
      - name: Run representative browser interactions
        run: node /tmp/browser/smoke.mjs
      - name: Keep final screenshots
        if: always()
        run: |
          mkdir -p docs/verification
          for image in desktop-library desktop-reading desktop-desk desktop-complete mobile-desk mobile-landscape failure; do
            if test -f /tmp/evidence/$image.png; then cp /tmp/evidence/$image.png docs/verification/$image.png; fi
          done
          git add docs/verification
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh representative desktop and touch screenshots'
            git push origin HEAD:codex/issue-1-manuscript-desk
          fi
      - name: Diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-verification
          path: |
            /tmp/evidence/
            /tmp/server.log
          retention-days: 7
      - name: Report tested revision
        if: always()
        run: git log -3 --oneline
