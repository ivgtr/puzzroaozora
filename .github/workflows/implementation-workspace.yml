name: Implementation verification (temporary)
on:
  push:
    branches: [codex/issue-1-manuscript-desk]
    paths: [.github/workflows/implementation-workspace.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused tests
        id: tests
        continue-on-error: true
        run: npm test
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Type check
        id: types
        continue-on-error: true
        run: npm run typecheck
      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Summarize
        if: always()
        run: |
          echo 'Tests: ${{ steps.tests.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lint: ${{ steps.lint.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Types: ${{ steps.types.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build: ${{ steps.build.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.types.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
