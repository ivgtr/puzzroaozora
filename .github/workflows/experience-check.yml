name: Experience verification (temporary)
on:
  pull_request:
    branches: [codex/issue-1-manuscript-desk]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run lint && npm run typecheck && npm run build
      - name: Prepare isolated browser verification
        run: |
          npm install --prefix /tmp/browser --no-audit --no-fund playwright
          /tmp/browser/node_modules/.bin/playwright install --with-deps chromium
          node --experimental-strip-types --input-type=module -e 'import {PASSAGES} from "./src/data/passages.ts"; console.log(JSON.stringify(PASSAGES))' > /tmp/passages.json
          mkdir -p /tmp/evidence
          npm start -- -H 127.0.0.1 -p 5678 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5678 >/dev/null && break; sleep 1; done
      - name: Desktop and mobile interactions
        run: node scripts/experience-check.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experience-verification
          path: |
            /tmp/evidence/
            /tmp/server.log
          retention-days: 7
