name: Hint context and twelve questions verification (temporary)
on:
  pull_request:
    branches: [codex/issue-1-manuscript-desk]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run lint && npm run typecheck && npm run build
      - name: Prepare isolated browser and unchanged baseline
        run: |
          npm install --prefix /tmp/browser --no-audit --no-fund playwright@1.58.2
          /tmp/browser/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p /tmp/evidence /tmp/hint-before
          git archive 95155fa | tar -x -C /tmp/hint-before
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/hint-before/node_modules
          (cd /tmp/hint-before && npm run build) > /tmp/baseline-build.log 2>&1
          npm start -- -H 127.0.0.1 -p 5678 > /tmp/server.log 2>&1 &
          (cd /tmp/hint-before && npm start -- -H 127.0.0.1 -p 5679) > /tmp/baseline-server.log 2>&1 &
          for port in 5678 5679; do
            ready=0
            for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:$port" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = 1 || { echo "Server $port did not become ready"; exit 1; }
          done
      - name: Real desktop and touch interactions with comparison captures
        env:
          APP_URL: http://127.0.0.1:5678
          BASELINE_URL: http://127.0.0.1:5679
          BASELINE_REF: 95155fa
          PLAYWRIGHT_MODULE: /tmp/browser/node_modules/playwright/index.mjs
          EVIDENCE_DIR: /tmp/evidence
        run: node --experimental-strip-types scripts/hint-context-check.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hint-context-verification
          path: |
            /tmp/evidence/
            /tmp/server.log
            /tmp/baseline-server.log
            /tmp/baseline-build.log
          retention-days: 7
